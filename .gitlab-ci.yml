# Lints and publishes the pi dev container feature to this project's registry.
#
# Conventions follow https://code.siemens.com/siemens/code (docs/ci, docs/cd):
#   * shared runners are tagged DOCKER (x86-64) or DOCKER-AARCH64 (ARM)
#   * shared runners have no direct internet; proxy via $CODE_PROXY / $CODE_NO_PROXY
#   * no Docker-in-Docker on shared runners
#
# Docker-in-Docker is not needed here: `devcontainer features publish` packages the
# feature into a tarball and pushes it over the OCI HTTP API. It never builds an image.
# The flip side is that CI *cannot* execute install.sh -- see AGENTS.md for the local
# verification step that has to happen before an MR.

stages:
  - validate
  - publish

variables:
  http_proxy: "$CODE_PROXY"
  https_proxy: "$CODE_PROXY"
  no_proxy: "$CODE_NO_PROXY"
  # Some tooling only reads the upper-case forms.
  HTTP_PROXY: "$CODE_PROXY"
  HTTPS_PROXY: "$CODE_PROXY"
  NO_PROXY: "$CODE_NO_PROXY"
  DEVCONTAINER_CLI: "@devcontainers/cli@0.88.0"
  FEATURE_SRC: "src"
  FEATURE_JSON: "src/pi/devcontainer-feature.json"
  # Where the devcontainer CLI looks for registry credentials.
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"

default:
  image: node:24-bookworm
  tags:
    - DOCKER
  interruptible: true

# One pipeline per change: merge requests, plus the default branch after merge.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# --------------------------------------------------------------------- validate

shellcheck:
  stage: validate
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  script:
    # The feature's install step runs under the image's /bin/sh, so POSIX only.
    - shellcheck --shell=sh src/pi/install.sh
    # Host scripts target bash on the developer's machine.
    - shellcheck --shell=bash bin/dev-up bin/dev-pi bin/dev-down install.sh scripts/*.sh

feature-metadata:
  stage: validate
  script:
    - node scripts/check-feature-metadata.mjs

# The two tracks share a contract that nothing enforces at runtime; see the script.
contract:
  stage: validate
  script:
    - bash scripts/check-contract.sh

# The published tags are consumed as a floating major (`pi:1`) by dev-up. Publishing
# without a version bump is a silent no-op: the CLI skips an already-published version,
# so `:1` keeps resolving to the old digest and the change never reaches any consumer.
#
# Scoped to src/: changes that only touch the host scripts are a separate release track
# and must not force a feature bump or republish a byte-identical feature.
version-bump:
  stage: validate
  script:
    - bash scripts/check-version-bump.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*

# ---------------------------------------------------------------------- publish

publish:
  stage: publish
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" \
        > "$DOCKER_CONFIG/config.json"
    - >
      npx --yes "$DEVCONTAINER_CLI" features publish "$FEATURE_SRC"
      --registry "$CI_REGISTRY"
      --namespace "$CI_PROJECT_PATH"
    - rm -f "$DOCKER_CONFIG/config.json"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
  environment:
    name: registry
    url: $CI_PROJECT_URL/container_registry
